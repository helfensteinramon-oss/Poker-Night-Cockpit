<!doctype html><html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#091711"><title>Poker Night · Cash Game</title><style>
:root{--bg:#091711;--panel:#12271e;--panel2:#193529;--line:#315042;--gold:#eac47c;--text:#f4f1e7;--muted:#9aafa4;--green:#70dfad;--red:#ff8c8c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#23513b,#091711 55%);color:var(--text);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px}button,input,select{font:inherit}button{cursor:pointer}button:active{transform:scale(.97)}.app{max-width:660px;margin:auto;padding:20px 16px 105px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.eyebrow{font-size:10px;letter-spacing:3px;color:var(--gold);font-weight:800}.brand{font-family:Georgia,serif;font-size:30px;font-weight:bold;margin:5px 0}.suit{color:var(--gold)}.round{border:1px solid var(--line);background:var(--panel);color:var(--gold);border-radius:50%;width:44px;height:44px;font-size:23px}.hero{margin-top:20px;border:1px solid #94744288;border-radius:22px;padding:22px;background:radial-gradient(circle at 90% 0%,#3a5337 0%,#1c3527 38%,#10251c 80%);box-shadow:0 18px 45px #0004;position:relative;overflow:hidden}.hero:after{content:'♠';position:absolute;right:5px;top:5px;font-size:160px;opacity:.055;transform:rotate(-15deg);pointer-events:none}.hero small{color:#c8c4a7;letter-spacing:2px;font-size:10px;font-weight:800}.hero h1{font-family:Georgia,serif;font-size:26px;margin:9px 0 14px}.hero .amount{font-size:39px;font-weight:800;letter-spacing:-1px}.hero .amount span{font-size:14px;color:var(--gold);letter-spacing:0}.hero .sub{color:var(--muted);font-size:12px;margin-top:8px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0 22px}.stat{border:1px solid var(--line);border-radius:15px;background:#12281f;padding:13px 9px}.stat b{display:block;font-size:19px;margin-top:6px}.stat small{font-size:10px;color:var(--muted)}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:22px 0 12px}.sectionhead h2{font-family:Georgia,serif;font-size:21px;margin:0}.btn{background:var(--gold);border:0;border-radius:12px;color:#17251c;padding:11px 14px;font-weight:800}.btn.secondary{background:#203e30;border:1px solid #43654f;color:var(--text)}.btn.danger{background:#4c2829;color:#ffd5d5}.btn.small{font-size:12px;padding:8px 11px}.player{background:linear-gradient(135deg,#182e23,#11251c);border:1px solid var(--line);border-radius:17px;padding:14px;margin-bottom:10px}.player-top{display:flex;align-items:center;gap:11px}.avatar{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;background:#34543b;border:1px solid #66865c;color:#f6dfaa;font-family:Georgia,serif;font-size:20px;flex-shrink:0}.pname{font-size:16px;font-weight:800}.hint{color:var(--muted);font-size:11px;margin-top:3px}.right{margin-left:auto;text-align:right}.money{font-size:17px;font-weight:800}.positive{color:var(--green)}.negative{color:var(--red)}.neutral{color:var(--gold)}.player-bottom{display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap}.tag{background:#274435;border:1px solid #41604a;border-radius:9px;color:#dfecdd;padding:8px 10px;font-size:12px;font-weight:700}.spacer{flex:1}.chipbutton{background:#273b31;border:1px solid #68846d;color:var(--gold);border-radius:9px;padding:8px 10px;font-size:12px;font-weight:800}.tabs{position:fixed;bottom:0;left:0;right:0;background:#0d1d17f5;border-top:1px solid var(--line);display:flex;justify-content:center;padding:9px 9px max(12px,env(safe-area-inset-bottom));backdrop-filter:blur(12px);z-index:5}.tabs-inner{display:flex;width:min(660px,100%);justify-content:space-around}.tab{color:var(--muted);background:none;border:0;padding:5px 10px;font-size:11px;display:grid;gap:4px;justify-items:center}.tab .ico{font-size:23px}.tab.active{color:var(--gold);font-weight:800}.panel{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:16px;margin:12px 0}.field{display:grid;gap:7px;margin:13px 0}.field label{color:#c7d4ca;font-size:12px;font-weight:700}.field input,.field select{width:100%;min-width:0;border-radius:11px;border:1px solid #496453;background:#0b1c15;color:var(--text);padding:13px;outline:none}.field input:focus{border-color:var(--gold)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.muted{color:var(--muted)}.empty{text-align:center;padding:35px 10px;color:var(--muted)}.check{padding:15px;border-radius:13px;border:1px solid var(--line);margin:13px 0;font-weight:700}.check.good{background:#183d2b;color:#91e6b2}.check.bad{background:#492923;color:#ffd3c0}.settle{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);gap:10px}.settle:last-child{border:0}.archive{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:13px 0}.archive:last-child{border:0}.archive .right{white-space:nowrap}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.overlay{position:fixed;inset:0;background:#000a;z-index:10;display:flex;align-items:flex-end;justify-content:center}.modal{background:#152c21;border:1px solid #56745d;border-radius:24px 24px 0 0;padding:24px;width:min(660px,100%);max-height:90dvh;overflow:auto;padding-bottom:max(26px,env(safe-area-inset-bottom))}.modal h2{font-family:Georgia,serif;margin:0 0 12px}.modal .actions{display:flex;gap:9px;margin-top:19px}.modal .actions button{flex:1}.chip{width:52px;height:52px;border:5px dashed #f6e1a2;border-radius:50%;background:#b34242;display:grid;place-items:center;font-weight:900;color:white;box-shadow:0 5px 0 #722727,0 8px 20px #0005;transform:rotate(-15deg);font-size:12px}.quick{display:flex;gap:8px;flex-wrap:wrap}.quick button{background:#284636;border:1px solid #66856a;border-radius:10px;padding:10px 14px;color:var(--gold);font-weight:800}.mini{font-size:11px;color:var(--muted);line-height:1.5}.warning{color:#f5b6a0}.hidden{display:none!important}hr{border:0;border-top:1px solid var(--line);margin:18px 0}@media(min-width:650px){.modal{border-radius:24px;margin-bottom:30px}.overlay{align-items:center}} .denoms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:18px 0}.denom{border:1px solid var(--line);background:#0b2018;border-radius:15px;padding:12px;display:grid;justify-items:center;gap:7px}.denom label{font-size:11px;color:var(--muted)}.denom-icon{width:49px;height:49px;border-radius:50%;display:grid;place-items:center;border:5px dashed #fff9;font-size:12px;font-weight:900;color:white;box-shadow:0 3px 10px #0005}.d0{background:#8b433a}.d1{background:#276d9a}.d2{background:#3c8758}.d3{background:#343c4b}.d4{background:#8e60a1}.d5{background:#bc8e2e}.stepper{display:flex;width:100%;gap:4px;align-items:center}.stepper button{border:1px solid #58765e;border-radius:8px;background:#264332;color:var(--gold);font-size:18px;min-width:31px;height:36px}.stepper input{width:100%;min-width:0;text-align:center;border:1px solid #496453;background:#071911;color:white;border-radius:8px;padding:7px 2px;font-weight:800}.chip-total{display:flex;justify-content:space-between;align-items:center;border:1px solid #aa8c4b;background:#2d3825;border-radius:13px;padding:17px 13px;margin:14px 0}.chip-total b{color:var(--gold);font-size:22px}@media(max-width:360px){.denoms{gap:6px}.denom{padding:8px}.stepper button{min-width:27px}} </style></head><body><div class="app"><header class="top"><div><div class="eyebrow">♠ PRIVATE CASH GAME ♦</div><div class="brand">POKER <span class="suit">NIGHT.</span></div></div><button class="round" onclick="openMenu()" aria-label="Menü">⚙</button></header><main id="view"></main></div><nav class="tabs"><div class="tabs-inner"><button class="tab active" data-tab="table" onclick="switchTab('table')"><span class="ico">♠</span>Tisch</button><button class="tab" data-tab="cash" onclick="switchTab('cash')"><span class="ico">◈</span>Abrechnung</button><button class="tab" data-tab="history" onclick="switchTab('history')"><span class="ico">▤</span>Historie</button><button class="tab" data-tab="stats" onclick="switchTab('stats')"><span class="ico">♛</span>Statistik</button></div></nav><div id="modalroot"></div><script>
const KEY='poker-night-cockpit-v2';const uid=()=>Math.random().toString(36).slice(2,10);const today=()=>new Date().toLocaleDateString('en-CA');const initial=()=>({current:{id:uid(),date:today(),title:'Poker Night',rate:0.01,players:[]},history:[]});let state;try{state=JSON.parse(localStorage.getItem(KEY))||initial()}catch(e){state=initial()}if(!state.current)state.current=initial().current;state.current.rate=0.01;if(!Array.isArray(state.history))state.history=[];let tab='table';let modal='';const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('Speichern fehlgeschlagen. Bitte Speicherplatz prüfen.')}};const money=n=>'CHF '+Number(n||0).toLocaleString('de-CH',{minimumFractionDigits:2,maximumFractionDigits:2});const num=n=>Math.round((Number(n)||0)*100)/100;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const getP=id=>state.current.players.find(p=>p.id===id);const invested=p=>num((p.buyins||[]).reduce((a,b)=>a+Number(b),0));const payout=(p,g=state.current)=>num(Number(p.chips||0)*Number(g.rate||0));const profit=(p,g=state.current)=>num(payout(p,g)-invested(p));const sum=(arr,fn)=>num(arr.reduce((a,b)=>a+fn(b),0));const pDate=d=>{let a=(d||'').split('-');return a.length===3?`${a[2]}.${a[1]}.${a[0]}`:d};const signed=n=>(n>0?'+':'')+money(n);const pc=n=>n>0?'positive':n<0?'negative':'neutral';function switchTab(t){tab=t;render()};function render(){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));const v=document.getElementById('view');v.innerHTML=tab==='table'?tableView():tab==='cash'?cashView():tab==='history'?historyView():statsView()}
function tableView(){let g=state.current,ps=g.players,total=sum(ps,invested);return `<section class="hero"><small>♠ ${esc(pDate(g.date))} · ${esc(g.title.toUpperCase())}</small><h1>Der Pot gehört euch.</h1><div class="amount"><span>CHF </span>${total.toLocaleString('de-CH',{minimumFractionDigits:2})}</div><div class="sub">Gesamte Einzahlungen am Tisch</div></section><div class="stats"><div class="stat"><small>SPIELER</small><b>${ps.length}</b></div><div class="stat"><small>BUY-INS</small><b>${sum(ps,p=>(p.buyins||[]).length)}</b></div><div class="stat"><small>BLINDS</small><b>10/25 Rp.</b></div></div><div class="sectionhead"><h2>Am Pokertisch</h2><button class="btn small" onclick="openPlayer()">＋ Spieler</button></div>${ps.length?ps.map(p=>`<article class="player"><div class="player-top"><div class="avatar">${esc(p.name.slice(0,1).toUpperCase())}</div><div><div class="pname">${esc(p.name)}</div><div class="hint">${(p.buyins||[]).length} Einzahlungen · ${money(invested(p))}</div></div><div class="right"><div class="money ${p.chips==null?'neutral':pc(profit(p))}">${p.chips==null?'Noch offen':signed(profit(p))}</div><div class="hint">${p.chips==null?'Chipcount fehlt':'Nach Chipcount'}</div></div></div><div class="player-bottom"><span class="tag">◈ ${p.chips==null?'Nicht gezählt':money(payout(p))}</span><button class="chipbutton" onclick="openBuyin('${p.id}')">＋ Buy-in</button><button class="chipbutton" onclick="openChips('${p.id}')">♠ Chips</button><span class="spacer"></span><button class="chipbutton" onclick="openEdit('${p.id}')">•••</button></div></article>`).join(''):`<div class="empty"><div style="font-size:46px">♠ ♥ ♣ ♦</div><h3>Die Karten sind gemischt.</h3>Füge deine Pokerkollegen hinzu und starte den Abend.<p><button class="btn" onclick="openPlayer()">Ersten Spieler hinzufügen</button></p></div>`}<p class="mini">Chipwerte: 10 / 25 / 50 / 100 / 500 / 1000 Rappen. Ein Rebuy von maximal CHF 20 ist nur bei einem Stack unter CHF 10 möglich.</p><button class="btn secondary" style="width:100%;margin-top:8px" onclick="switchTab('cash')">Zur Abrechnung →</button>`}
function balances(g){return g.players.map(p=>({name:p.name,amount:num(payout(p,g)-invested(p))}))}function transfers(g){let b=balances(g),deb=b.filter(x=>x.amount<-.005).map(x=>({...x,amount:-x.amount})),cred=b.filter(x=>x.amount>.005);let out=[];for(let d of deb)for(let c of cred){let n=num(Math.min(d.amount,c.amount));if(n>.005){out.push({from:d.name,to:c.name,amount:n});d.amount=num(d.amount-n);c.amount=num(c.amount-n)}}return out}function check(g){let pot=sum(g.players,invested),paid=sum(g.players,p=>payout(p,g));return {pot,paid,diff:num(pot-paid)}}
function cashView(){let g=state.current,c=check(g),ready=g.players.length>0&&g.players.every(p=>p.chips!==null&&p.chips!==undefined&&p.chips!=='');return `<div class="sectionhead"><h2>Die Abrechnung</h2><button class="btn small secondary" onclick="copyResults()">⧉ Kopieren</button></div><section class="hero"><small>GESAMTER POT</small><div class="amount"><span>CHF </span>${c.pot.toLocaleString('de-CH',{minimumFractionDigits:2})}</div><div class="sub">Gezählte Chips: ${money(c.paid)} · Blinds 10/25 Rp.</div></section><div class="check ${ready&&Math.abs(c.diff)<.005?'good':'bad'}">${!ready?'◌ Noch nicht alle Chipcounts eingetragen':Math.abs(c.diff)<.005?'✓ Kasse stimmt! Alle Chips sind erfasst.':`⚠ Differenz: ${signed(c.diff)} · ${c.diff>0?'Chipwerte fehlen':'Zu viele Chips erfasst'}`}</div><div class="panel"><h3>Gewinn & Auszahlung</h3>${g.players.length?g.players.map(p=>`<div class="settle"><div><b>${esc(p.name)}</b><div class="mini">Einsatz ${money(invested(p))} · ${p.chips==null?'Nicht gezählt':money(payout(p,g))} Chipwert</div></div><div class="right"><b>${money(payout(p,g))}</b><div class="${pc(profit(p))}">${signed(profit(p))}</div></div></div>`).join(''):'Noch keine Spieler erfasst.'}</div><div class="panel"><h3>Wer bezahlt wem?</h3>${!ready||Math.abs(c.diff)>.005?'<p class="warning">Zuerst alle Chipcounts eintragen und die Kassendifferenz auf null bringen.</p>':transfers(g).length?transfers(g).map(t=>`<div class="settle"><div><b>${esc(t.from)}</b><div class="mini">bezahlt an ${esc(t.to)}</div></div><b class="neutral">${money(t.amount)}</b></div>`).join(''):'<p class="muted">Keine Ausgleichszahlungen notwendig.</p>'}</div><button class="btn" style="width:100%" onclick="finishGame()">♛ Spielabend abschliessen</button><p class="mini">Ein Abschluss wird nur bei vollständiger, ausgeglichener Abrechnung zugelassen. Der Abend wird in der Historie gespeichert.</p>`}
function historyView(){return `<div class="sectionhead"><h2>Vergangene Nächte</h2></div><div class="panel">${state.history.length?state.history.map(g=>`<div class="archive"><div class="chip">♠</div><div><b>${esc(g.title)}</b><div class="mini">${pDate(g.date)} · ${g.players.length} Spieler</div></div><div class="right"><b>${money(sum(g.players,invested))}</b><div style="margin-top:7px"><button class="btn small secondary" onclick="showArchive('${g.id}')">Ansehen</button></div></div></div>`).join(''):'<div class="empty">Noch keine abgeschlossenen Pokerabende.<br>Hier entsteht eure Legende. ♛</div>'}</div>`}
function statsView(){let map={};for(let g of state.history)for(let p of g.players){let k=p.name.trim().toLowerCase();if(!map[k])map[k]={name:p.name,games:0,net:0,invested:0,wins:0};let x=map[k],pr=profit(p,g);x.games++;x.net=num(x.net+pr);x.invested=num(x.invested+invested(p));if(pr>0)x.wins++}let entries=Object.values(map).sort((a,b)=>b.net-a.net);return `<div class="sectionhead"><h2>Hall of Fame ♛</h2></div><div class="panel">${entries.length?entries.map((x,i)=>`<div class="settle"><div><b>${i===0?'🏆 ':''}${esc(x.name)}</b><div class="mini">${x.games} Abende · ${x.wins} profitable Abende · Einsatz ${money(x.invested)}</div></div><div class="right"><b class="${pc(x.net)}">${signed(x.net)}</b></div></div>`).join(''):'<div class="empty">Nach dem ersten abgeschlossenen Abend erscheint hier die Rangliste eurer Pokercrew.</div>'}</div><p class="mini">Die Rangliste berücksichtigt nur abgeschlossene Spiele.</p>`}
function showModal(content){document.getElementById('modalroot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">${content}</div></div>`};function closeModal(){document.getElementById('modalroot').innerHTML=''};function field(id,label,value,type='text',extra=''){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value)}" ${extra}></div>`};function openPlayer(){showModal(`<h2>♠ Spieler am Tisch</h2>${field('playerName','Name','', 'text','maxlength="40" autocomplete="off"')}${field('firstBuy','Erster Buy-in (CHF, max. 20)','20','number','min="0.01" max="20" step="0.05"')}<p class="mini">Cash Game 10/25 Rp. · maximal CHF 20 pro Einkauf</p><div class="actions"><button class="btn secondary" onclick="closeModal()">Abbrechen</button><button class="btn" onclick="addPlayer()">Hinzufügen</button></div>`);document.getElementById('playerName').focus()};
function addPlayer(){let name=document.getElementById('playerName').value.trim(),n=Number(document.getElementById('firstBuy').value);if(!name||!Number.isFinite(n)||n<=0||n>20||Math.round(n*100)!==n*100&&Math.abs(Math.round(n*100)-n*100)>.001)return alert('Bitte Namen und einen Buy-in zwischen CHF 0.01 und CHF 20 eingeben.');state.current.players.push({id:uid(),name,buyins:[num(n)],chips:null});save();closeModal();render()};
function openBuyin(id){let p=getP(id);showModal(`<h2>♠ Live-Rebuy · ${esc(p.name)}</h2><p class="mini">Ein Rebuy ist nur erlaubt, wenn der aktuelle Stack unter CHF 10 liegt. Du musst den Stack nicht mehr eintippen.</p><div class="quick"><button onclick="quickRebuy('${id}',20)">＋ CHF 20 · 1 Tipp</button><button onclick="quickRebuy('${id}',10)">＋ CHF 10</button></div>${field('buy','Anderer Rebuy-Betrag (CHF)','20','number','min="0.01" max="20" step="0.05"')}<p class="mini">Bisher eingezahlt: ${money(invested(p))}. Vor dem Buchen bestätigst du die Unter-CHF-10-Regel.</p><div class="actions"><button class="btn secondary" onclick="closeModal()">Abbrechen</button><button class="btn" onclick="addBuyin('${id}')">＋ Betrag buchen</button></div>`)}
function quickRebuy(id,n){if(!confirm(`Liegt der aktuelle Chipstack unter CHF 10?\n\nDann CHF ${n.toFixed(2)} Rebuy für ${getP(id).name} buchen.`))return;recordRebuy(id,n)}
function recordRebuy(id,n){let p=getP(id);p.buyins.push(num(n));p.chips=null;p.lastRebuyStack=null;save();closeModal();render()}
function addBuyin(id){let n=Number(document.getElementById('buy').value);if(!Number.isFinite(n)||n<=0||n>20)return alert('Ein Rebuy darf höchstens CHF 20 betragen.');quickRebuy(id,n)}
const DENOMS=[10,25,50,100,500,1000];
function chipForm(p){return `<div class="denoms">${DENOMS.map((d,i)=>`<div class="denom"><div class="denom-icon d${i}">${d}</div><label for="d${d}">${d} Rp.</label><div class="stepper"><button type="button" onclick="stepChip(${d},-1)">−</button><input id="d${d}" type="number" min="0" step="1" inputmode="numeric" value="${Number(p.counts?.[d]||0)}" oninput="updateChipPreview()"><button type="button" onclick="stepChip(${d},1)">＋</button></div></div>`).join('')}</div><div class="chip-total"><span>Auszahlungswert</span><b id="chipPreview">CHF 0.00</b></div>`}
function stepChip(d,delta){let el=document.getElementById('d'+d);el.value=Math.max(0,(Number(el.value)||0)+delta);updateChipPreview()}
function readChipCounts(){let counts={},cents=0;for(let d of DENOMS){let el=document.getElementById('d'+d),n=Number(el.value);if(!Number.isSafeInteger(n)||n<0)return null;counts[d]=n;cents+=d*n}return {counts,cents}}
function updateChipPreview(){let r=readChipCounts();document.getElementById('chipPreview').textContent=r?money(r.cents/100):'Ungültige Eingabe'}
function openChips(id){let p=getP(id);showModal(`<h2>♠ Chipcount · ${esc(p.name)}</h2><p class="mini">Zähle die Chips nach Nennwert. Jeder Wert entspricht Rappen, z. B. 1000 = CHF 10.</p>${chipForm(p)}<div class="actions"><button class="btn secondary" onclick="closeModal()">Abbrechen</button><button class="btn" onclick="setChips('${id}')">Chipcount speichern</button></div>`);updateChipPreview()}
function setChips(id){let r=readChipCounts();if(!r)return alert('Bitte nur ganze, nicht negative Chip-Anzahlen eintragen.');let p=getP(id);p.counts=r.counts;p.chips=r.cents;save();closeModal();render()};
function openEdit(id){let p=getP(id);showModal(`<h2>Spieler bearbeiten</h2>${field('editname','Name',p.name)}<div class="panel"><b>Einzahlungen</b>${p.buyins.length?p.buyins.map((n,i)=>`<div class="settle"><span>Buy-in ${i+1}: ${money(n)}</span><button class="btn small danger" onclick="removeBuyin('${id}',${i})">Entfernen</button></div>`).join(''):'<p class="mini">Keine Einzahlungen</p>'}</div><div class="actions"><button class="btn danger" onclick="deletePlayer('${id}')">Löschen</button><button class="btn" onclick="renamePlayer('${id}')">Name speichern</button></div><button class="btn secondary" style="width:100%;margin-top:10px" onclick="closeModal()">Schliessen</button>`)}function renamePlayer(id){let name=document.getElementById('editname').value.trim();if(!name)return alert('Name fehlt.');getP(id).name=name;save();closeModal();render()};function removeBuyin(id,i){if(!confirm('Diesen Buy-in entfernen?'))return;getP(id).buyins.splice(i,1);save();openEdit(id);render()};function deletePlayer(id){if(!confirm('Spieler und alle Einzahlungen löschen?'))return;state.current.players=state.current.players.filter(p=>p.id!==id);save();closeModal();render()};function openMenu(){let g=state.current;showModal(`<h2>⚙ Spielabend & Daten</h2>${field('title','Titel',g.title)}${field('date','Datum',g.date,'date')}<p class="mini">Fixe Spielregeln: Blinds 10/25 Rappen, Chips zu 10 / 25 / 50 / 100 / 500 / 1000 Rappen, maximal CHF 20 pro Buy-in oder Rebuy. Rebuy nur bei weniger als CHF 10 Stack.</p><button class="btn" style="width:100%" onclick="saveSettings()">Einstellungen speichern</button><hr><div class="row"><button class="btn secondary" onclick="exportData()">↓ Backup (JSON)</button><button class="btn secondary" onclick="document.getElementById('import').click()">↑ Backup laden</button><input id="import" class="hidden" type="file" accept="application/json,.json" onchange="importData(this)"></div><p class="mini">Daten werden lokal in diesem Browser gespeichert. Für einen Gerätewechsel oder zur Sicherheit regelmässig ein Backup exportieren.</p><button class="btn danger" style="width:100%" onclick="resetCurrent()">Aktuellen Abend zurücksetzen</button><button class="btn secondary" style="width:100%;margin-top:10px" onclick="closeModal()">Schliessen</button>`)}function saveSettings(){let title=document.getElementById('title').value.trim(),date=document.getElementById('date').value,rate=0.01;if(!title||!date)return alert('Bitte gültige Angaben machen.');Object.assign(state.current,{title,date,rate});save();closeModal();render()};function finishGame(){let g=state.current,c=check(g);if(!g.players.length||g.players.some(p=>p.chips===null||p.chips===undefined||p.chips===''))return alert('Bitte für alle Spieler den Chipcount eintragen.');if(Math.abs(c.diff)>.005)return alert('Die Kasse ist noch nicht ausgeglichen: '+signed(c.diff));if(!confirm('Spielabend abschliessen und in die Historie übernehmen?'))return;state.history.unshift(JSON.parse(JSON.stringify(g)));state.current={id:uid(),date:today(),title:'Poker Night',rate:0.01,players:g.players.map(p=>({id:uid(),name:p.name,buyins:[],chips:null}))};save();tab='history';render()};function resetCurrent(){if(!confirm('Aktuellen Abend und seine Einträge löschen? Abgeschlossene Abende bleiben erhalten.'))return;let g=state.current;state.current={id:uid(),date:today(),title:'Poker Night',rate:0.01,players:g.players.map(p=>({id:uid(),name:p.name,buyins:[],chips:null}))};save();closeModal();tab='table';render()};function resultText(g){let c=check(g);return `♠ ${g.title} · ${pDate(g.date)}\nPot: ${money(c.pot)}\n\n`+g.players.map(p=>`${p.name}: Einsatz ${money(invested(p))} | Auszahlung ${money(payout(p,g))} | ${signed(profit(p,g))}`).join('\n')+`\n\nDifferenz: ${money(c.diff)}\n`+(Math.abs(c.diff)<.005?'\nAusgleich:\n'+(transfers(g).map(t=>`${t.from} → ${t.to}: ${money(t.amount)}`).join('\n')||'Keine'):'Chipcounts prüfen')};function copyResults(){let t=resultText(state.current);if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(()=>alert('Abrechnung kopiert!')).catch(()=>fallbackCopy(t))}else fallbackCopy(t)}function fallbackCopy(t){let a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();let ok=document.execCommand('copy');a.remove();if(ok)alert('Abrechnung kopiert!');else showModal(`<h2>Abrechnung kopieren</h2><textarea style="width:100%;height:260px">${esc(t)}</textarea><button class="btn" onclick="closeModal()">Schliessen</button>`)}function showArchive(id){let g=state.history.find(x=>x.id===id);if(!g)return;showModal(`<h2>♛ ${esc(g.title)}</h2><p class="muted">${pDate(g.date)} · Pot ${money(sum(g.players,invested))}</p>${g.players.map(p=>`<div class="settle"><div><b>${esc(p.name)}</b><div class="mini">Einsatz ${money(invested(p))} · Auszahlung ${money(payout(p,g))}</div></div><b class="${pc(profit(p,g))}">${signed(profit(p,g))}</b></div>`).join('')}<div class="actions"><button class="btn secondary" onclick="copyArchive('${id}')">⧉ Kopieren</button><button class="btn secondary" onclick="closeModal()">Schliessen</button></div><button class="btn danger" style="width:100%;margin-top:12px" onclick="deleteArchive('${id}')">Abend löschen</button>`)}function copyArchive(id){let g=state.history.find(x=>x.id===id),t=resultText(g);if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(()=>alert('Kopiert!')).catch(()=>fallbackCopy(t));else fallbackCopy(t)}function deleteArchive(id){if(!confirm('Diesen historischen Spielabend endgültig löschen?'))return;state.history=state.history.filter(g=>g.id!==id);save();closeModal();render()};function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Poker_Night_Backup_'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function importData(el){let f=el.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let s=JSON.parse(r.result);if(!s.current||!Array.isArray(s.current.players)||!Array.isArray(s.history))throw Error();if(s.current.rate!==0.01)throw Error('Nur Backups mit Rappen-Chipcount importieren.');if(!confirm('Alle bestehenden Daten durch dieses Backup ersetzen?'))return;state=s;save();closeModal();render()}catch(e){alert('Ungültiges Poker-Night-Backup.')}};r.readAsText(f)}render();
</script></body></html>
